<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto Individual</title>
  </head>
  <body>
    <div>
      <h3>Título</h3>
    </div>

    <div class="container">
      <div class="pergunta">
        <h5>Nome completo</h5>
        <input type="text" id="input_nome" />
      </div>
      <div class="pergunta">
        <h5>E-mail</h5>
        <input type="text" id="input_email" />
      </div>
      <div class="pergunta">
        <h5>Telefone</h5>
        <input type="tel" id="input_telefone">
      </div>
      <div class="pergunta">
        <h5>Data de nascimento</h5>
        <input type="date" id="input_dtNascimento" />
      </div>
      <div class="pergunta">
        <h5>Endereço</h5>
        <input type="text" id="input_endereco">
      </div>
      <div>
        <h5>Turno</h5>
        <input type="radio" name="turno" id="input_turno">
        <label for="turno">Manhã</label>
        <input type="radio" name="turno" id="input_turno">
        <label for="turno">Tarde</label>
        <input type="radio" name="turno" id="input_turno">
        <label for="turno">Noite</label>
      </div>
      <div>
        <h5>Curso técnico</h5>
        <select name="turno" id="slt_curso">
          <option value="#" selected disabled>Escolha um curso</option>
          <option value="ads">Análise e desenvolvimento de sistemas</option>
          <option value="adm">Administração</option>
          <option value="eco">Economia</option>
          <option value="mec">Mecatrônica</option>
          <option value="enf">Enfermagem</option>
          <option value="mar">Marketing</option>
          <option value="dg">Design gráfico</option>
        </select>
      </div>
      <div class="checkbox">
        <h5>Atividades extracurriculares</h5>
        <input type="checkbox" id="input_atv" name="esp" />
        <label for="esp">Esportes</label>

        <input type="checkbox" id="input_atv" name="mus" />
        <label for="mus">Música</label>

        <input type="checkbox" id="input_atv" name="tea" />
        <label for="tea">Teatro</label>

        <input type="checkbox" id="input_atv" name="ic" />
        <label for="ic">Iniciação científica</label>

        <input type="checkbox" id="input_atv" name="ge" />
        <label for="ge">Grêmio estudantil</label>
      </div>
      <button onclick="cadastrar()">Cadastrar</button>
    </div>
  </body>
</html>

<script>
    const nome = input_nome.value;
    const email = input_email.value;
    const telefone = input_telefone.value;
    const dtNacimento = input_dtNascimento.value;
    const endereco = input_endereco.value;
    const turno = input_turno.value;
    const curso = slt_curso.value;
    const atv = input_atv.value;

    function cadastrar(nome, email, telefone, dtNacimento, endereco, turno, curso, atv){
        
        // Validação de campos
        if (!nome || nome.length < 4){
            alert("Nome inválido.")
        } else if (!email || email.length < 11){
            alert("E-mail inválido.")
        } else if (!telefone || telefone.length < 11){
            alert("Telefone inválido.")
        } else if (!dtNacimento){
            alert("Data de nascimento inválido.")
        } else if (turno == null){
            alert("Turno inválido.")
        } else if (curso == "#"){
            alert("Curso inválido.")
        } else if (atv == null){
            alert("Atividades extracurriculares inválido.")
        } else {
            alert("tudo certo! ;)")
        }
    }


</script>
